# 全局: ThetaStar
# 局部: TEB（Timed Elastic Band）—— 仿真版，针对本车(差速、车宽24cm)预调
#
# 基座沿用 nav2_params_rpp.yaml 的仿真设置(use_sim_time / /scan / 仿真 footprint / keepout / ThetaStar)
# 只把 controller_server 的局部控制器换成 TEB。
#
# ★★ 窄通道三个关键参数(调 TEB 先盯这三个，其它先别动)：
#    1) min_obstacle_dist  —— 机器人离障碍的最小距离。35cm通道单边只剩~5cm，这个必须 ≤ 0.05，否则 TEB 找不到解
#    2) footprint_model    —— 用 polygon 精确足迹，窄缝里别用粗略的圆
#    3) weight_viapoint + global_plan_viapoint_sep —— 让 TEB 贴着全局路径中线走
#
# 安装: sudo apt install ros-humble-teb-local-planner
# 官方参数说明: https://github.com/rst-tu-dortmund/teb_local_planner

