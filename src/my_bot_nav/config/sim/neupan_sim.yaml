# =============================================================================
# NeuPAN 规划器参数
# 作者/社区无专门调参指南，仅零散说明；据此只对"重要参数"加注：
#   - 核心作者：主要调参在 adjust 段；想跑更快调 receding/iter_num/*_max_num/iter_threshold；
#     robot 的 length/width 必须与实车一致
#   - neupan_cpp 作者点名主要调参：collision_threshold、adjust.d_max/d_min、ref_speed、max_speed
# 注释依据：neupan_cpp 源码（neupan_planner.cpp 解析、nrmp.cpp 代价函数）+ NeuPAN 核心 docstring。
# 标【neupan_cpp 未读取】者：已核对源码，该 C++ 版不解析，改之无效。
# =============================================================================

receding: 4            # MPC 后退时域步数。调大→看得更远、轨迹更平滑但计算量↑；调小→算得快、反应快但短视（作者列为提速可调项）
step_time: 0.25
ref_speed: 0.4          # 参考(期望)速度(m/s)，受 max_speed 上限约束。调大→跑更快但避障余量小；调小→更稳更慢
collision_threshold: -1 # 碰撞检测阈值(m)：最近障碍距离低于它即触发硬急停(零速)。调大→更早急停更安全、窄处易停死；调小→敢靠近但撞险↑
                           # backoff.enabled: false 时可设 ≤ 0（如 -1）= 关掉急停；backoff 开着时必须 > 0，否则 validated() 加载即抛异常（退避永远触发不了）
                           # 关掉 backoff 后这是 controller 层唯一的急停判据；真正的避障余量在 adjust.d_min/d_max 与 costmap 的 inflation_radius
device: 'cpu'           # 【neupan_cpp 未读取】C++ 版无 PyTorch，改之无效 
time_print: False       # 【neupan_cpp 未读取】仅上游 Python 版用于打印规划耗时，改之无效

robot:
  kinematics: 'diff'    # 运动学模型；neupan_cpp 仅支持 'diff'
  max_speed: [0.4, 1.6]   # [线速度, 角速度] 上限，约束实际输出。调大→机动性强但更险；调小→更稳
  max_acce: [1.2, 1.2]
  # 车体用裸车身外廓 10 边形（base 系、逆时针），与 my_bot_hw/config/laser_filters.yaml 的 body_polygon_filter 同一份。
  # 原 22×22 矩形的四角比圆盘车身胖 3cm（原地转扫过半径 0.19 vs 0.16），40cm 口子前会算成"转不开"而停住。
  # 写了 vertices 就不读 length/width/wheelbase；需配合 pan.dune_exact: true（没有按这个形状训的网络）
  vertices: [[0.063, 0.0615], [0.035, 0.11], [-0.0765, 0.11], [-0.1275, 0.0805], [-0.157, 0.0295], [-0.157, -0.0295], [-0.1275, -0.0805], [-0.0765, -0.11], [0.035, -0.11], [0.063, -0.0615]]

ipath:
  curve_style: 'line'   # 参考路径插值方式；neupan_cpp 仅支持 'line'（Python 版另支持 dubins/reeds）
  loop: False
  arrive_threshold: 0.05
  close_threshold: 0.05
  ind_range: 10
  arrive_index_threshold: 1

pan:
  iter_num: 2           # DUNE↔NRMP 交替最小化的外层迭代次数。调大→收敛更好、轨迹更优但耗时↑；调小→更快但可能未收敛（提速可调项）
  dune_max_num: 2500    # DUNE 层考虑的最大障碍点数。超过时是"均匀抽点"不是留最近的，最近的墙可能被丢掉 → 设得比局部窗口里的致命格总数大
                        # （3×3 窗口、2.5cm 格在 my_world_40 上约 1000～2000 个）
  nrmp_max_num: 10      # NRMP 层考虑的最大障碍点数。调大→约束更全更安全但更慢；调小→更快但避障信息少（提速可调项）
  dune_exact: true      # true：点到车体的距离按多边形几何精确算，不用 DUNE 网络（dune_checkpoint 被忽略）。
                        # 网络在车身几厘米内会少算最多 5cm（训练点撒在 ±25m，车身附近几乎没样本），窄道里误判急停
  iter_threshold: 0.1   # 判定迭代收敛的阈值，改进量低于它即停。调大→更早停更快但精度差；调小→迭代更充分但更慢（提速可调项）

adjust:                 # ← 作者：调参主要在本段
  q_s: [1.5, 1.5, 0.6]  # 状态(x,y,θ)跟踪权重（代价含 2·qs²）。作者：值越大→越贴合初始路径；调小→允许偏离、给避障让路
  p_u: 2.5              # 速度跟踪权重（代价含 2·p_u²）。调大→更贴 ref_speed；调小→允许变速以避障
  eta: 10.0             # 安全距离奖励增益（目标含 -eta·d，鼓励远离障碍）。调大→更保守绕行、离障更远；调小→允许贴近、路径更短
  d_max: 0.08          # 距离变量上界（硬约束, m）。调大→规划灵活度↑；调小→强制在更小距离范围内
  d_min: 0.03           # 距离变量下界（硬约束, m）。调大→强制离障更远更安全、窄处易不可行；调小→敢更近
                        # my_world_40：0.01/0.03 + 5cm 格会蹭墙头，0.05 在 40cm 口子前转不开停住；0.03 配局部 2.5cm 格
  ro_obs: 400.0         # 避障约束违反的二次罚权重（J += 0.5·ro_obs·neg²）。调大→强惩闯障更安全；作者：值越小→可能需更多迭代才收敛
  bk: 0.0               # proximal 正则系数（J += 0.5·bk·(s−nom_s)²），拉近名义轨迹助收敛。调大→更稳定但探索性差；调小/0→无此正则

# 退避(retreat-on-stop)：fork 独有、默认关闭。
# 关闭理由：与 Nav2 BT 恢复链的 BackUp / Spin 职责重叠（见 my_bot_nav 的
# 下面三个值原样保留，要复活只需把 enabled 改回 true。
backoff:
  enabled: false
  release_distance: 0.1   # 退避目标：min_distance(离障碍距离) 退到 ≥ 此值才算"退够了"、恢复正常前进；没到之前每帧都会继续退/转。调大→要求退得更远更保守，但更难达标；调小→更快恢复前进，但可能没退开就又贴上去
  max_cycles: 60          # 退避最多尝试帧数：退满这么多帧还没达到 release_distance 就放弃，原地硬停，把问题交给 Nav2（重规划/恢复动作），不会无限退下去。调大→给退避更多机会退够；调小→更快放弃、更快交给外层处理
  turn_speed: 1.2         # 障碍在侧面（非正前/正后）时原地转开的角速度(rad/s)：差速车没有横移自由度，纯前后退对侧向障碍距离改变很小，改为转向躲开
