# =============================================================================
# NeuPAN 规划器参数（仿真）
# 作者/社区无专门调参指南，仅零散说明；据此只对"重要参数"加注：
#   - 核心作者：主要调参在 adjust 段；想跑更快调 receding/iter_num/*_max_num/iter_threshold；
#     robot 的 length/width 必须与实车一致
#   - neupan_cpp 作者点名主要调参：collision_threshold、adjust.d_max/d_min、ref_speed、max_speed
# 注释依据：neupan_cpp 源码（neupan_planner.cpp 解析、nrmp.cpp 代价函数）+ NeuPAN 核心 docstring。
# 标【neupan_cpp 未读取】者：已核对源码，该 C++ 版不解析，改之无效。
# =============================================================================

receding: 6            # MPC 后退时域步数。调大→看得更远、轨迹更平滑但计算量↑；调小→算得快、反应快但短视（作者列为提速可调项）
step_time: 0.25
ref_speed: 0.3          # 参考(期望)速度(m/s)，受 max_speed 上限约束。调大→跑更快但避障余量小；调小→更稳更慢
collision_threshold: 0.01  # 碰撞检测阈值(m)：最近障碍距离低于它即触发停车。调大→更早急停更安全、窄处易停死；调小→敢靠近但撞险↑
device: 'cpu'           # 【neupan_cpp 未读取】C++ 版无 PyTorch，改之无效
time_print: False       # 【neupan_cpp 未读取】仅上游 Python 版用于打印规划耗时，改之无效

robot:
  kinematics: 'diff'    # 运动学模型；neupan_cpp 仅支持 'diff'
  max_speed: [0.3, 3.14]   # [线速度, 角速度] 上限，约束实际输出。调大→机动性强但更险；调小→更稳
  max_acce: [1.0, 0.2]
  length: 0.18          # 机器人几何长度(m)，碰撞几何用，必须与实车一致（覆盖车身+驱动轮+脚轮完整外廓，2026-07-18 重训后由 0.16 改为 0.18）
  width: 0.22           # 机器人几何宽度(m)，碰撞几何用，必须与实车一致

ipath:
  curve_style: 'line'   # 参考路径插值方式；neupan_cpp 仅支持 'line'（Python 版另支持 dubins/reeds）
  loop: False
  arrive_threshold: 0.05
  close_threshold: 0.05
  ind_range: 10
  arrive_index_threshold: 1

pan:
  iter_num: 1           # DUNE↔NRMP 交替最小化的外层迭代次数。调大→收敛更好、轨迹更优但耗时↑；调小→更快但可能未收敛（提速可调项）
  dune_max_num: 100     # DUNE 层考虑的最大障碍点数。调大→障碍表达更全但算力↑；调小→更快但可能漏障碍（提速可调项）
  nrmp_max_num: 10      # NRMP 层考虑的最大障碍点数。调大→约束更全更安全但更慢；调小→更快但避障信息少（提速可调项）
  iter_threshold: 0.1   # 判定迭代收敛的阈值，改进量低于它即停。调大→更早停更快但精度差；调小→迭代更充分但更慢（提速可调项）

adjust:                 # ← 作者：调参主要在本段
  q_s: [1.5, 1.5, 0.2]  # 状态(x,y,θ)跟踪权重（代价含 2·qs²）。作者：值越大→越贴合初始路径；调小→允许偏离、给避障让路
  p_u: 2.5              # 速度跟踪权重（代价含 2·p_u²）。调大→更贴 ref_speed；调小→允许变速以避障
  eta: 10.0             # 安全距离奖励增益（目标含 -eta·d，鼓励远离障碍）。调大→更保守绕行、离障更远；调小→允许贴近、路径更短
  d_max: 0.15            # 距离变量上界（硬约束, m）。调大→规划灵活度↑；调小→强制在更小距离范围内
  d_min: 0.01           # 距离变量下界（硬约束, m）。调大→强制离障更远更安全、窄处易不可行；调小→敢更近
  ro_obs: 400.0         # 避障约束违反的二次罚权重（J += 0.5·ro_obs·neg²）。调大→强惩闯障更安全；作者：值越小→可能需更多迭代才收敛
  bk: 0.0               # proximal 正则系数（J += 0.5·bk·(s−nom_s)²），拉近名义轨迹助收敛。调大→更稳定但探索性差；调小/0→无此正则

backoff:
  enabled: true
  release_distance: 0.3   # 滞回：退到 min_dist ≥ 此值才恢复前进；≈ 正面退车距离（想退更多就调大它）
  max_cycles: 30          # 后退封顶帧数；须 ≥ release_distance/0.015 才退得到目标，否则被截断后交还 Nav2
