# 全局: ThetaStar
# 局部: MPPI（官方 Humble 默认配置 + 针对本车的定向修正）—— 仿真版
#
# 本文件 = nav2_params_rpp.yaml 的仿真基座（use_sim_time / /scan / 仿真 footprint / keepout）
#         + 官方 nav2_mppi_controller README 的默认 FollowPath 块
#         + 4 处定向修正（见下方 FollowPath 注释，★ 标注）
# 与实机版 nav2_params_hw_mppi.yaml 的 FollowPath 块逐字段一致，只有基座（仿真 vs 实机）不同。
# 官方原版来源: https://github.com/ros-navigation/navigation2/blob/humble/nav2_mppi_controller/README.md

