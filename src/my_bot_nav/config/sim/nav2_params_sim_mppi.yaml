bt_navigator_navigate_through_poses_rclcpp_node:
  ros__parameters:
    use_sim_time: True

bt_navigator_navigate_to_pose_rclcpp_node:
  ros__parameters:
    use_sim_time: True

controller_server:
  ros__parameters:
    use_sim_time: True
    controller_frequency: 30.0          # MPPI 官方推荐 30Hz（对应 batch 2000）
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.001
    min_theta_velocity_threshold: 0.001
    failure_tolerance: 0.3
    progress_checker_plugin: "progress_checker"
    goal_checker_plugins: ["general_goal_checker"]
    controller_plugins: ["FollowPath"]
    current_goal_checker: "general_goal_checker"

    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      required_movement_radius: 0.1
      movement_time_allowance: 10.0
    general_goal_checker:
      stateful: True
      plugin: "nav2_controller::SimpleGoalChecker"
      xy_goal_tolerance: 0.05        # 目标X、Y
      yaw_goal_tolerance: 6.28       # ★ 根治倒车入库：你不在乎最终朝向 → 放开 yaw

    # ───────────────────────────── MPPI 控制器 ─────────────────────────────
    # 官方默认值起步，仅做下列定向修正（★ 标注处）。改任何 critic 前先读 docs/MPPI 社区调参经验.md
    FollowPath:
      plugin: "nav2_mppi_controller::MPPIController"

      # —— 预测视野（官方默认，未改）——
      # 预测视野 = time_steps×model_dt = 2.8s ; ×vx_max(0.2) = 0.56m ≤ 局部costmap半径1.5m ✓
      time_steps: 56
      model_dt: 0.05
      batch_size: 2000              # 官方 30Hz 对应值；仿真随便跑，实机若掉帧再降到 1000
      iteration_count: 1

      # —— ★ 修正1：速度上下限对齐真实底盘 / velocity_smoother（max 0.2 m/s, 0.6 rad/s）——
      vx_max:  0.2                   # 官方 0.5
      vx_min: -0.2                   # 官方 -0.35
      vy_max:  0.0                   # 差速车无横移
      wz_max:  0.6                   # 官方 1.9
      motion_model: "DiffDrive"

      # —— ★ 修正2：探索噪声按本车速度比例缩小（治"走直线走不直"主因）——
      # 官方噪声是按 vx_max0.5/wz_max1.9 给的，本车速度只有 ~1/3，噪声同比缩
      vx_std:  0.1                   # 官方 0.2
      vy_std:  0.0                   # 官方 0.2 → 差速车横向恒 0
      wz_std:  0.25                  # 官方 0.4；治蛇行曾降到 0.15，但太小→采样不到"绕弯"轨迹→不避障。回调到 0.25 折中，蛇行交给 TwirlingCritic 压

      prune_distance: 1.7
      transform_tolerance: 0.1
      temperature: 0.3
      gamma: 0.015
      visualize: false
      regenerate_noises: false
      reset_period: 1.0

      AckermannConstraints:
        min_turning_r: 0.2

      # —— ★ 修正3+4：加 TwirlingCritic（治原地扭动）、提 PathAlign（治蛇行）、提 PreferForward（抑制倒车）——
      critics: ["ConstraintCritic", "CostCritic", "GoalCritic", "GoalAngleCritic",
                "PathAlignCritic", "PathFollowCritic", "PathAngleCritic",
                "PreferForwardCritic", "TwirlingCritic"]

      ConstraintCritic:
        enabled: true
        cost_power: 1
        cost_weight: 4.0
      GoalCritic:
        enabled: true
        cost_power: 1
        cost_weight: 5.0
        threshold_to_consider: 1.4
      GoalAngleCritic:
        enabled: true
        cost_power: 1
        cost_weight: 3.0
        threshold_to_consider: 0.5
      PreferForwardCritic:
        enabled: true
        cost_power: 1
        cost_weight: 10.0            # ★ 官方 5.0 → 10.0，抑制中途倒车
        threshold_to_consider: 0.5
      CostCritic:                    # 这是 MPPI 的避障核心 critic
        enabled: true
        cost_power: 1
        cost_weight: 12.0            # ★ 4.0→12.0：官方明确"避碰撞就把 Cost critic 权重调高"。障碍在代价图里却照撞=这个力太弱，没压过 GoalCritic
        critical_cost: 300.0
        consider_footprint: false    # ★★ 根因修复(GitHub #4808)：true 时窄通道里 footprintCost 全返回 INSCRIBED，
                                     #    代价场"变平"无梯度 → MPPI 原地卡死。false 改用中心点代价，恢复梯度，能找中线。
        collision_cost: 1000000.0
        near_goal_distance: 1.0
      PathAlignCritic:
        enabled: true
        cost_power: 1
        cost_weight: 14.0           # ★ 回到官方 14.0：曾提到 22 治蛇行，但太"贴线"→不敢绕障。降回 14 给绕障留空间
        max_path_occupancy_ratio: 0.05
        trajectory_point_step: 3
        threshold_to_consider: 0.5
        offset_from_furthest: 20
        use_path_orientations: false
      PathFollowCritic:
        enabled: true
        cost_power: 1
        cost_weight: 8.0
        offset_from_furthest: 5
        threshold_to_consider: 1.4
      PathAngleCritic:
        enabled: true
        cost_power: 1
        cost_weight: 2.0
        offset_from_furthest: 4
        threshold_to_consider: 0.5
        max_angle_to_furthest: 1.0
        forward_preference: true
      TwirlingCritic:                # ★ 新增：专治原地扭动 / 蛇行
        enabled: true
        cost_power: 1
        cost_weight: 10.0

local_costmap:
  local_costmap:
    ros__parameters:
      update_frequency: 20.0
      publish_frequency: 1.0
      global_frame: odom
      robot_base_frame: base_footprint
      use_sim_time: True
      rolling_window: true
      width: 3
      height: 3
      resolution: 0.05

      # footprint: "[[0.035, 0.101], [0.035, -0.101], [-0.089, -0.101], [-0.089, 0.101]]"
      footprint: "[[0.05, 0.121], [0.05, -0.121], [-0.104, -0.121], [-0.104, 0.121]]"

      plugins: ["voxel_layer", "keepout_filter", "inflation_layer"]
      keepout_filter:
        plugin: "nav2_costmap_2d::KeepoutFilter"
        enabled: True
        filter_info_topic: "/costmap_filter_info"
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 3.0      # ★ 6.0→3.0：衰减放缓，代价场变"中间低两边高的碗"，把车往通道中线引（配合 consider_footprint:false）
        inflation_radius: 0.17        # ★ 回到 0.17：中心点判障需 ≥ 车外接半径(0.16m)才不蹭墙（之前降 0.08/0.10 是治错了方向）
      voxel_layer:
        plugin: "nav2_costmap_2d::VoxelLayer"
        enabled: True
        publish_voxel_map: True
        origin_z: 0.0
        z_resolution: 0.05
        z_voxels: 16
        max_obstacle_height: 2.0
        mark_threshold: 0
        observation_sources: scan
        scan:
          topic: /scan
          max_obstacle_height: 2.0
          clearing: True
          marking: True
          data_type: "LaserScan"
          raytrace_max_range: 3.0
          raytrace_min_range: 0.0
          obstacle_max_range: 2.5
          obstacle_min_range: 0.1
      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_subscribe_transient_local: True
      always_send_full_costmap: True

global_costmap:
  global_costmap:
    ros__parameters:
      update_frequency: 1.0
      publish_frequency: 1.0
      global_frame: map
      robot_base_frame: base_footprint
      use_sim_time: True

      # footprint: "[[0.055, 0.131], [0.055, -0.131], [-0.109, -0.131], [-0.109, 0.131]]"
      robot_radius: 0.1

      resolution: 0.05
      track_unknown_space: true
      plugins: ["static_layer", "obstacle_layer", "keepout_filter", "inflation_layer"]
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: True
        observation_sources: scan
        scan:
          topic: /scan
          max_obstacle_height: 2.0
          clearing: True
          marking: True
          data_type: "LaserScan"
          raytrace_max_range: 4.0
          raytrace_min_range: 0.0
          obstacle_max_range: 3.5
          obstacle_min_range: 0.1
      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_subscribe_transient_local: True
      keepout_filter:
        plugin: "nav2_costmap_2d::KeepoutFilter"
        enabled: True
        filter_info_topic: "/costmap_filter_info"
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 6.0
        inflation_radius: 0.2
      always_send_full_costmap: True

# Keepout 禁行区滤波信息服务（掩码由 keepout_mask_diff 节点直接发布）
costmap_filter_info_server:
  ros__parameters:
    use_sim_time: True
    type: 0                                  # 0 = keepout/preferred-lane 滤波
    filter_info_topic: "/costmap_filter_info"
    mask_topic: "/keepout_filter_mask"
    base: 0.0
    multiplier: 1.0

map_server:
  ros__parameters:
    use_sim_time: True
    yaml_filename: ""

map_saver:
  ros__parameters:
    use_sim_time: True
    save_map_timeout: 5.0
    free_thresh_default: 0.25
    occupied_thresh_default: 0.65
    map_subscribe_transient_local: True

planner_server:
  ros__parameters:
    expected_planner_frequency: 1.0
    use_sim_time: True
    planner_plugins: ["GridBased"]
    GridBased:
      plugin: "nav2_theta_star_planner/ThetaStarPlanner"
      how_many_corners: 8       # 邻接数，8 是默认
      w_euc_cost: 1.5           # 欧式距离权重
      w_traversal_cost: 2.0     # 通过代价（cost）权重——越大越远离障碍
      w_heuristic_cost: 1.0     # A* 启发权重
      use_final_approach_orientation: false

smoother_server:
  ros__parameters:
    use_sim_time: True
    smoother_plugins: ["simple_smoother"]
    simple_smoother:
      plugin: "nav2_smoother::SimpleSmoother"
      tolerance: 1.0e-10
      max_its: 1000
      do_refinement: True

behavior_server:
  ros__parameters:
    costmap_topic: local_costmap/costmap_raw
    footprint_topic: local_costmap/published_footprint
    cycle_frequency: 10.0
    behavior_plugins: ["spin", "backup", "drive_on_heading", "assisted_teleop", "wait"]
    spin:
      plugin: "nav2_behaviors/Spin"
    backup:
      plugin: "nav2_behaviors/BackUp"
    drive_on_heading:
      plugin: "nav2_behaviors/DriveOnHeading"
    wait:
      plugin: "nav2_behaviors/Wait"
    assisted_teleop:
      plugin: "nav2_behaviors/AssistedTeleop"
    global_frame: odom
    robot_base_frame: base_footprint
    transform_tolerance: 0.1
    use_sim_time: True
    simulate_ahead_time: 2.0
    max_rotational_vel: 0.6
    min_rotational_vel: 0.2
    rotational_acc_lim: 1.5

robot_state_publisher:
  ros__parameters:
    use_sim_time: True

waypoint_follower:
  ros__parameters:
    use_sim_time: True
    loop_rate: 20
    stop_on_failure: false
    waypoint_task_executor_plugin: "wait_at_waypoint"
    wait_at_waypoint:
      plugin: "nav2_waypoint_follower::WaitAtWaypoint"
      enabled: True
      waypoint_pause_duration: 200

velocity_smoother:
  ros__parameters:
    use_sim_time: True
    smoothing_frequency: 20.0
    scale_velocities: False
    feedback: "OPEN_LOOP"
    max_velocity: [0.2, 0.0, 0.6]
    min_velocity: [-0.2, 0.0, -0.6]
    max_accel: [0.8, 0.0, 1.5]
    max_decel: [-0.8, 0.0, -1.5]
    odom_topic: "odom"
    odom_duration: 0.1
    deadband_velocity: [0.0, 0.0, 0.0]
    velocity_timeout: 1.0
