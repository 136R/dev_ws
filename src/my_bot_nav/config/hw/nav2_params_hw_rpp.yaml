controller_server:
  ros__parameters:
    use_sim_time: False
    controller_frequency: 20.0
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.001
    min_theta_velocity_threshold: 0.001
    failure_tolerance: 0.3
    progress_checker_plugin: "progress_checker"
    goal_checker_plugins: ["general_goal_checker"]
    controller_plugins: ["FollowPath"]
    current_goal_checker: "general_goal_checker"

    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      required_movement_radius: 0.1
      movement_time_allowance: 10.0
    general_goal_checker:
      stateful: True
      plugin: "nav2_controller::SimpleGoalChecker"
      xy_goal_tolerance: 0.05        # 目标X、Y
      yaw_goal_tolerance: 6.28       # 目标 Yaw

    # ───────────────────────────── RPP 控制器 ─────────────────────────────
    FollowPath:
      plugin: "nav2_regulated_pure_pursuit_controller::RegulatedPurePursuitController"

      # —— 速度/加速度（对齐你的 velocity_smoother：max 0.2 m/s, accel 0.8）——
      desired_linear_vel: 0.2
      min_approach_linear_velocity: 0.05      # 接近目标时的最低速
      approach_velocity_scaling_dist: 0.4     # 距目标 0.4m 开始线性减速
      max_allowed_time_to_collision_up_to_carrot: 1.0   # 1s 内会撞就停

      # —— Lookahead（前瞻点）——
      # 室内 0.2 m/s 低速场景下，lookahead 0.4~0.6m 比较合适
      use_velocity_scaled_lookahead_dist: true
      lookahead_dist: 0.3            # 固定 lookahead 兜底
      min_lookahead_dist: 0.15        # 慢速时也不能太短
      max_lookahead_dist: 0.4        # 高速时也不能太长
      lookahead_time: 1.0            # vel_scaled 模式下 = vel * 1.5s

      # —— 速度调控（regulation）——
      # 这是 RPP 的招牌：在急转弯/接近障碍时自动减速
      use_regulated_linear_velocity_scaling: true
      regulated_linear_scaling_min_radius: 0.45   # 转弯半径 < 0.45m 开始减速
      regulated_linear_scaling_min_speed: 0.05   # 减速下限

      use_cost_regulated_linear_velocity_scaling: true   # 靠近障碍也减速
      cost_scaling_dist: 0.3         # 距障碍 0.3m 内开始减速
      cost_scaling_gain: 1.0
      inflation_cost_scaling_factor: 6.0    # 必须等于 local_costmap inflation_layer 的 cost_scaling_factor

      # —— 差速车专项：原地转向对齐路径 ——
      # 这是 RPP 替代 RotationShim 的内置功能，差速车强烈建议开启
      use_rotate_to_heading: true
      rotate_to_heading_min_angle: 0.349        # 偏差 > 20° 时先原地转
      rotate_to_heading_angular_vel: 0.6        # 原地转的角速度
      max_angular_accel: 1.5                    # 对齐 velocity_smoother 的 1.5

      # —— 碰撞检测（前瞻撞墙就停）——
      use_collision_detection: false

      # —— 反向行驶（差速车默认禁，配合 use_rotate_to_heading）——
      allow_reversing: false

      # —— 其他 ——
      transform_tolerance: 0.1
      max_robot_pose_search_dist: 10.0
      use_interpolation: true        # 路径点稀疏时插值，跟踪更平滑

local_costmap:
  local_costmap:
    ros__parameters:
      update_frequency: 20.0
      publish_frequency: 1.0
      global_frame: odom
      robot_base_frame: base_footprint
      use_sim_time: False
      rolling_window: true
      width: 3
      height: 3
      resolution: 0.05

      # 车体外廓 = 圆盘 ∪ 两个驱动轮，不是单纯的圆：
      #   圆盘   以 (-0.047, 0) 为心、r=0.11（base_link 在圆心前方 0.047，故 robot_radius 画不出来）
      #   驱动轮 俯视是矩形 x∈[-0.035, 0.035]、|y|∈[0.082, 0.11]（轮 r=0.035、厚 0.028、轴距中心 0.096）
      # ⚠️ 轮子必须单独算进来：圆盘在 x=0 处的半宽只有 √(0.11²-0.047²)=0.0995，而轮外沿在 0.11
      #    —— 轮子在此突出盘缘 10.5 mm。
      #    2026-08-12 修复：旧值只按「圆盘 + 余量」取正 12 边形，导致轮子前外角 (0.035, 0.11)
      #    露在 footprint 外 5.4 mm。改这个数时务必把轮子四角一起验，不要只验圆盘。
      # 现值：对 12 个方向取「外廓支撑函数 + 0.025 余量」的外切多边形，全部关键点余量均匀 25 mm。
      #      四个主轴方向与旧值完全相同（前 0.088 / 后 -0.182 / 侧 ±0.135），只在轮子所在斜向外扩。
      # 裸外廓（无余量）备查：
      # footprint: "[[0.063, 0.0615], [0.035, 0.11], [-0.0765, 0.11], [-0.1275, 0.0805], [-0.157, 0.0295], [-0.157, -0.0295], [-0.1275, -0.0805], [-0.0765, -0.11], [0.035, -0.11], [0.063, -0.0615]]"
      footprint: "[[0.088, 0.0682], [0.0533, 0.1283], [0.0417, 0.135], [-0.0832, 0.135], [-0.1458, 0.0988], [-0.182, 0.0362], [-0.182, -0.0362], [-0.1458, -0.0988], [-0.0832, -0.135], [0.0417, -0.135], [0.0533, -0.1283], [0.088, -0.0682]]"

      plugins: ["voxel_layer", "keepout_filter", "inflation_layer"]
      keepout_filter:
        plugin: "nav2_costmap_2d::KeepoutFilter"
        enabled: True
        filter_info_topic: "/costmap_filter_info"
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 6.0
        inflation_radius: 0.2
      voxel_layer:
        plugin: "nav2_costmap_2d::VoxelLayer"
        enabled: True
        publish_voxel_map: True
        origin_z: 0.0
        z_resolution: 0.05
        z_voxels: 16
        max_obstacle_height: 2.0
        mark_threshold: 0
        observation_sources: scan
        scan:
          topic: /scan_filtered
          max_obstacle_height: 2.0
          clearing: True
          marking: True
          data_type: "LaserScan"
          # range filter 把超程点换成 +inf；默认 inf_is_valid=false 会把这些束**整束丢弃**，
          # 于是那个方向根本不做 raytrace 清障，动态障碍走了也留残影。
          # True = 把 +inf 当作"测到 range_max"，用于清障。（spec F6）
          inf_is_valid: True
          raytrace_max_range: 3.0
          raytrace_min_range: 0.0
          obstacle_max_range: 2.5
          obstacle_min_range: 0.1
      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_subscribe_transient_local: True
      always_send_full_costmap: True

global_costmap:
  global_costmap:
    ros__parameters:
      update_frequency: 1.0
      publish_frequency: 1.0
      global_frame: map
      robot_base_frame: base_footprint
      use_sim_time: False

      # 车体外廓 = 圆盘 ∪ 两个驱动轮，不是单纯的圆：
      #   圆盘   以 (-0.047, 0) 为心、r=0.11（base_link 在圆心前方 0.047，故 robot_radius 画不出来）
      #   驱动轮 俯视是矩形 x∈[-0.035, 0.035]、|y|∈[0.082, 0.11]（轮 r=0.035、厚 0.028、轴距中心 0.096）
      # ⚠️ 轮子必须单独算进来：圆盘在 x=0 处的半宽只有 √(0.11²-0.047²)=0.0995，而轮外沿在 0.11
      #    —— 轮子在此突出盘缘 10.5 mm。
      #    2026-08-12 修复：旧值只按「圆盘 + 余量」取正 12 边形，导致轮子前外角 (0.035, 0.11)
      #    露在 footprint 外 5.4 mm。改这个数时务必把轮子四角一起验，不要只验圆盘。
      # 现值：对 12 个方向取「外廓支撑函数 + 0.025 余量」的外切多边形，全部关键点余量均匀 25 mm。
      #      四个主轴方向与旧值完全相同（前 0.088 / 后 -0.182 / 侧 ±0.135），只在轮子所在斜向外扩。
      # 裸外廓（无余量）备查：
      # footprint: "[[0.063, 0.0615], [0.035, 0.11], [-0.0765, 0.11], [-0.1275, 0.0805], [-0.157, 0.0295], [-0.157, -0.0295], [-0.1275, -0.0805], [-0.0765, -0.11], [0.035, -0.11], [0.063, -0.0615]]"
      footprint: "[[0.088, 0.0682], [0.0533, 0.1283], [0.0417, 0.135], [-0.0832, 0.135], [-0.1458, 0.0988], [-0.182, 0.0362], [-0.182, -0.0362], [-0.1458, -0.0988], [-0.0832, -0.135], [0.0417, -0.135], [0.0533, -0.1283], [0.088, -0.0682]]"

      resolution: 0.05
      track_unknown_space: true
      plugins: ["static_layer", "obstacle_layer", "keepout_filter", "inflation_layer"]
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: True
        observation_sources: scan
        scan:
          topic: /scan_filtered
          max_obstacle_height: 2.0
          clearing: True
          marking: True
          data_type: "LaserScan"
          inf_is_valid: True           # 同 local_costmap，见上面的说明（spec F6）
          raytrace_max_range: 4.0
          raytrace_min_range: 0.0
          obstacle_max_range: 3.5
          obstacle_min_range: 0.1
      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_subscribe_transient_local: True
      keepout_filter:
        plugin: "nav2_costmap_2d::KeepoutFilter"
        enabled: True
        filter_info_topic: "/costmap_filter_info"
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 6.0
        inflation_radius: 0.2
      always_send_full_costmap: True

# Keepout 禁行区滤波信息服务（掩码由 keepout_mask_diff 节点直接发布）
costmap_filter_info_server:
  ros__parameters:
    use_sim_time: False
    type: 0
    filter_info_topic: "/costmap_filter_info"
    mask_topic: "/keepout_filter_mask"
    base: 0.0
    multiplier: 1.0

map_server:
  ros__parameters:
    use_sim_time: False
    yaml_filename: ""

map_saver:
  ros__parameters:
    use_sim_time: False
    save_map_timeout: 5.0
    free_thresh_default: 0.25
    occupied_thresh_default: 0.65
    map_subscribe_transient_local: True

planner_server:
  ros__parameters:
    expected_planner_frequency: 1.0
    use_sim_time: False
    planner_plugins: ["GridBased"]
    GridBased:
      plugin: "nav2_theta_star_planner/ThetaStarPlanner"
      how_many_corners: 8       # 邻接数，8 是默认
      w_euc_cost: 1.5           # 欧式距离权重
      w_traversal_cost: 2.0     # 通过代价（cost）权重——越大越远离障碍
      w_heuristic_cost: 1.0     # A* 启发权重
      use_final_approach_orientation: false

smoother_server:
  ros__parameters:
    use_sim_time: False
    smoother_plugins: ["simple_smoother"]
    simple_smoother:
      plugin: "nav2_smoother::SimpleSmoother"
      tolerance: 1.0e-10
      max_its: 1000
      do_refinement: True

behavior_server:
  ros__parameters:
    costmap_topic: local_costmap/costmap_raw
    footprint_topic: local_costmap/published_footprint
    cycle_frequency: 10.0
    behavior_plugins: ["spin", "backup", "drive_on_heading", "assisted_teleop", "wait"]
    spin:
      plugin: "nav2_behaviors/Spin"
    backup:
      plugin: "nav2_behaviors/BackUp"
    drive_on_heading:
      plugin: "nav2_behaviors/DriveOnHeading"
    wait:
      plugin: "nav2_behaviors/Wait"
    assisted_teleop:
      plugin: "nav2_behaviors/AssistedTeleop"
    global_frame: odom
    robot_base_frame: base_footprint
    transform_tolerance: 0.1
    use_sim_time: False
    simulate_ahead_time: 2.0
    max_rotational_vel: 0.6
    min_rotational_vel: 0.2
    rotational_acc_lim: 1.5

robot_state_publisher:
  ros__parameters:
    use_sim_time: False

waypoint_follower:
  ros__parameters:
    use_sim_time: False
    loop_rate: 20
    stop_on_failure: false
    waypoint_task_executor_plugin: "wait_at_waypoint"
    wait_at_waypoint:
      plugin: "nav2_waypoint_follower::WaitAtWaypoint"
      enabled: True
      waypoint_pause_duration: 200

velocity_smoother:
  ros__parameters:
    use_sim_time: False
    smoothing_frequency: 20.0
    scale_velocities: False
    feedback: "OPEN_LOOP"
    max_velocity: [0.2, 0.0, 0.6]
    min_velocity: [-0.2, 0.0, -0.6]
    max_accel: [0.8, 0.0, 1.5]
    max_decel: [-0.8, 0.0, -1.5]
    odom_topic: "odom"
    odom_duration: 0.1
    deadband_velocity: [0.0, 0.0, 0.0]
    velocity_timeout: 1.0
