# 全局: SmacPlanner2D (nav2_smac_planner/SmacPlanner2D)
# 局部: RPP (nav2_regulated_pure_pursuit_controller::RegulatedPurePursuitController)
#
# 由 nav2_params_neupan_smac2d.yaml 派生。唯一差异: controller_server 的 FollowPath 由
# RotationShim+NeuPAN 换成 RPP（参数沿用旧 rpp 版）。planner/costmap/BT 等其余配置与 smac2d 版一致。

bt_navigator:
  ros__parameters:
    use_sim_time: False
    global_frame: map
    robot_base_frame: base_footprint
    odom_topic: /odometry/filtered
    bt_loop_duration: 20
    default_server_timeout: 20

    # 全局规划器更新频率 与 行为恢复
    # 用 smac2d 专用 BT（去掉了 SmoothPath，平滑全交给 SmacPlanner2D 内置 Smoother）。
    # ThetaStar 的几份配置仍用 navigate_to_pose_custom.xml —— ThetaStar 没有内置平滑器，
    # SmoothPath 是唯一的平滑环节，不能删。
    default_nav_to_pose_bt_xml: /home/orangepi/dev_ws/src/my_bot_nav/config/common/bt/navigate_to_pose_smac2d.xml

    wait_for_service_timeout: 1000
    plugin_lib_names:
      - nav2_compute_path_to_pose_action_bt_node
      - nav2_compute_path_through_poses_action_bt_node
      - nav2_smooth_path_action_bt_node
      - nav2_follow_path_action_bt_node
      - nav2_spin_action_bt_node
      - nav2_wait_action_bt_node
      - nav2_assisted_teleop_action_bt_node
      - nav2_back_up_action_bt_node
      - nav2_drive_on_heading_bt_node
      - nav2_clear_costmap_service_bt_node
      - nav2_is_stuck_condition_bt_node
      - nav2_goal_reached_condition_bt_node
      - nav2_goal_updated_condition_bt_node
      - nav2_globally_updated_goal_condition_bt_node
      - nav2_is_path_valid_condition_bt_node
      - nav2_initial_pose_received_condition_bt_node
      - nav2_reinitialize_global_localization_service_bt_node
      - nav2_rate_controller_bt_node
      - nav2_distance_controller_bt_node
      - nav2_speed_controller_bt_node
      - nav2_truncate_path_action_bt_node
      - nav2_truncate_path_local_action_bt_node
      - nav2_goal_updater_node_bt_node
      - nav2_recovery_node_bt_node
      - nav2_pipeline_sequence_bt_node
      - nav2_round_robin_node_bt_node
      - nav2_transform_available_condition_bt_node
      - nav2_time_expired_condition_bt_node
      - nav2_path_expiring_timer_condition
      - nav2_distance_traveled_condition_bt_node
      - nav2_single_trigger_bt_node
      - nav2_goal_updated_controller_bt_node
      - nav2_is_battery_low_condition_bt_node
      - nav2_navigate_through_poses_action_bt_node
      - nav2_navigate_to_pose_action_bt_node
      - nav2_remove_passed_goals_action_bt_node
      - nav2_planner_selector_bt_node
      - nav2_controller_selector_bt_node
      - nav2_goal_checker_selector_bt_node
      - nav2_controller_cancel_bt_node
      - nav2_path_longer_on_approach_bt_node
      - nav2_wait_cancel_bt_node
      - nav2_spin_cancel_bt_node
      - nav2_back_up_cancel_bt_node
      - nav2_assisted_teleop_cancel_bt_node
      - nav2_drive_on_heading_cancel_bt_node
      - nav2_is_battery_charging_condition_bt_node

bt_navigator_navigate_through_poses_rclcpp_node:
  ros__parameters:
    use_sim_time: False

bt_navigator_navigate_to_pose_rclcpp_node:
  ros__parameters:
    use_sim_time: False

controller_server:
  ros__parameters:
    use_sim_time: False
    controller_frequency: 20.0
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.001
    min_theta_velocity_threshold: 0.001
    failure_tolerance: 0.3
    progress_checker_plugin: "progress_checker"
    goal_checker_plugins: ["general_goal_checker"]
    controller_plugins: ["FollowPath"]
    current_goal_checker: "general_goal_checker"

    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      required_movement_radius: 0.1
      movement_time_allowance: 8.0    # 停住 8s 判无进度失败（配合 BT number_of_retries 封顶恢复时长）
    general_goal_checker:
      stateful: True
      plugin: "nav2_controller::SimpleGoalChecker"
      xy_goal_tolerance: 0.05
      yaw_goal_tolerance: 6.28       # 不约束 yaw (差速 line 跟踪不保证终点朝向)

    # ───────────────────────────── RPP 控制器 ─────────────────────────────
    FollowPath:
      plugin: "nav2_regulated_pure_pursuit_controller::RegulatedPurePursuitController"

      # —— 速度/加速度（对齐你的 velocity_smoother：max 0.2 m/s, accel 0.8）——
      desired_linear_vel: 0.4
      min_approach_linear_velocity: 0.1      # 接近目标时的最低速
      approach_velocity_scaling_dist: 0.4     # 距目标 0.4m 开始线性减速
      max_allowed_time_to_collision_up_to_carrot: 1.0   # 1s 内会撞就停

      # —— Lookahead（前瞻点）——
      # 室内 0.2 m/s 低速场景下，lookahead 0.4~0.6m 比较合适
      use_velocity_scaled_lookahead_dist: true
      lookahead_dist: 0.3            # 固定 lookahead 兜底
      min_lookahead_dist: 0.25        # 慢速时也不能太短
      max_lookahead_dist: 0.6        # 高速时也不能太长
      lookahead_time: 1.0            # vel_scaled 模式下 = vel * 1.5s

      # —— 速度调控（regulation）——
      # 这是 RPP 的招牌：在急转弯/接近障碍时自动减速
      use_regulated_linear_velocity_scaling: false
      regulated_linear_scaling_min_radius: 0.45   # 转弯半径 < 0.45m 开始减速
      regulated_linear_scaling_min_speed: 0.1   # 减速下限

      use_cost_regulated_linear_velocity_scaling: false   # 靠近障碍也减速
      cost_scaling_dist: 0.4         # 距障碍 0.3m 内开始减速
      cost_scaling_gain: 1.0
      inflation_cost_scaling_factor: 6.0    # 必须等于 local_costmap inflation_layer 的 cost_scaling_factor

      # —— 差速车专项：原地转向对齐路径 ——
      # 这是 RPP 替代 RotationShim 的内置功能，差速车强烈建议开启
      use_rotate_to_heading: true
      rotate_to_heading_min_angle: 0.5236       # 偏差 > 30° 时先原地转
      rotate_to_heading_angular_vel: 1.6        # 原地转的角速度
      max_angular_accel: 2.4                    # 对齐 velocity_smoother 的 1.5

      # —— 碰撞检测（前瞻撞墙就停）——
      use_collision_detection: false

      # —— 反向行驶（差速车默认禁，配合 use_rotate_to_heading）——
      allow_reversing: false

      # —— 其他 ——
      transform_tolerance: 0.1
      max_robot_pose_search_dist: 10.0
      use_interpolation: true        # 路径点稀疏时插值，跟踪更平滑

local_costmap:
  local_costmap:
    ros__parameters:
      update_frequency: 20.0
      publish_frequency: 1.0
      global_frame: odom
      robot_base_frame: base_footprint
      use_sim_time: False
      rolling_window: true
      width: 3
      height: 3
      resolution: 0.05

      footprint: "[[0.083, 0.0669], [0.0496, 0.1246], [0.0404, 0.13], [-0.0818, 0.13], [-0.1422, 0.0952], [-0.177, 0.0348], [-0.177, -0.0348], [-0.1422, -0.0952], [-0.0818, -0.13], [0.0404, -0.13], [0.0496, -0.1246], [0.083, -0.0669]]"

      plugins: ["obstacle_layer", "keepout_filter", "inflation_layer"]
      keepout_filter:
        plugin: "nav2_costmap_2d::KeepoutFilter"
        enabled: True
        filter_info_topic: "/costmap_filter_info"
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 6.0
        inflation_radius: 0.17
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: True
        observation_sources: scan
        scan:
          topic: /scan_filtered
          max_obstacle_height: 2.0
          clearing: True
          marking: True
          data_type: "LaserScan"
          # inf 射线，而清除障碍靠射线穿过格子 → 障碍标了永远清不掉。
          inf_is_valid: true
          # 不随雷达量程放大：本层被 3×3 窗口卡在 1.5m 半径，2.5 已经超出窗口了。
          raytrace_max_range: 3.0
          raytrace_min_range: 0.0
          obstacle_max_range: 2.5
          obstacle_min_range: 0.1
      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_subscribe_transient_local: True
      always_send_full_costmap: True

global_costmap:
  global_costmap:
    ros__parameters:
      update_frequency: 1.0
      publish_frequency: 1.0
      global_frame: map
      robot_base_frame: base_footprint
      use_sim_time: False

      footprint: "[[0.083, 0.0669], [0.0496, 0.1246], [0.0404, 0.13], [-0.0818, 0.13], [-0.1422, 0.0952], [-0.177, 0.0348], [-0.177, -0.0348], [-0.1422, -0.0952], [-0.0818, -0.13], [0.0404, -0.13], [0.0496, -0.1246], [0.083, -0.0669]]"

      resolution: 0.05
      track_unknown_space: true
      plugins: ["static_layer", "obstacle_layer", "keepout_filter", "inflation_layer"]
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: True
        observation_sources: scan
        scan:
          topic: /scan_filtered
          max_obstacle_height: 2.0
          clearing: True
          marking: True
          data_type: "LaserScan"
          inf_is_valid: true
          raytrace_max_range: 8.0
          raytrace_min_range: 0.0
          obstacle_max_range: 7.0
          obstacle_min_range: 0.1
      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_subscribe_transient_local: True
      keepout_filter:
        plugin: "nav2_costmap_2d::KeepoutFilter"
        enabled: True
        filter_info_topic: "/costmap_filter_info"
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 3.5
        inflation_radius: 0.2
      always_send_full_costmap: True

# Keepout 禁行区滤波信息服务（随 keepout.launch.py 启动）
costmap_filter_info_server:
  ros__parameters:
    use_sim_time: False
    type: 0                                  # 0 = keepout/preferred-lane 滤波
    filter_info_topic: "/costmap_filter_info"
    mask_topic: "/keepout_filter_mask"
    base: 0.0
    multiplier: 1.0

map_server:
  ros__parameters:
    use_sim_time: False
    yaml_filename: ""

map_saver:
  ros__parameters:
    use_sim_time: False
    save_map_timeout: 5.0
    free_thresh_default: 0.25
    occupied_thresh_default: 0.65
    map_subscribe_transient_local: True

planner_server:
  ros__parameters:
    expected_planner_frequency: 1.0
    use_sim_time: False
    planner_plugins: ["GridBased"]
    # 插件名保持 "GridBased" 不变——BT 里 ComputePathToPose 的 planner_id="GridBased" 才对得上
    GridBased:
      plugin: "nav2_smac_planner/SmacPlanner2D"
      tolerance: 0.15
      downsample_costmap: false         # 不降采样 costmap（分辨率已 0.05，够用）
      downsampling_factor: 1
      allow_unknown: true               # 允许穿未知区域（track_unknown_space=true，避免局部无解）
      max_iterations: 1000000           # 搜索迭代上限（放大防大地图早退）
      max_on_approach_iterations: 1000  # 接近目标后允许的额外迭代
      max_planning_time: 1.0            # 单次规划超时(s)
      cost_travel_multiplier: 2.5       # 通过代价权重：越大越偏好远离障碍的低代价栅格（离障余量↑）
      use_final_approach_orientation: false
      smoother:                         # SmacPlanner2D 自带的路径平滑。现在是唯一的平滑环节
                                        # ——BT 已换成 navigate_to_pose_smac2d.xml，没有 SmoothPath 了。
        max_iterations: 1000
        w_smooth: 0.2                   # 平滑项权重（越大越平滑，可能偏离原路径）
        w_data: 0.5                     # 贴合原始路径权重
        tolerance: 1.0e-10

smoother_server:
  ros__parameters:
    use_sim_time: False
    smoother_plugins: ["simple_smoother"]
    simple_smoother:
      plugin: "nav2_smoother::SimpleSmoother"
      tolerance: 1.0e-10
      max_its: 1000
      do_refinement: True

behavior_server:
  ros__parameters:
    costmap_topic: local_costmap/costmap_raw
    footprint_topic: local_costmap/published_footprint
    cycle_frequency: 10.0
    behavior_plugins: ["spin", "backup", "drive_on_heading", "assisted_teleop", "wait"]
    spin:
      plugin: "nav2_behaviors/Spin"
    backup:
      plugin: "nav2_behaviors/BackUp"
    drive_on_heading:
      plugin: "nav2_behaviors/DriveOnHeading"
    wait:
      plugin: "nav2_behaviors/Wait"
    assisted_teleop:
      plugin: "nav2_behaviors/AssistedTeleop"
    global_frame: odom
    robot_base_frame: base_footprint
    transform_tolerance: 0.1
    use_sim_time: False
    simulate_ahead_time: 2.0
    max_rotational_vel: 1.2
    min_rotational_vel: 0.35
    rotational_acc_lim: 2.4

robot_state_publisher:
  ros__parameters:
    use_sim_time: False

waypoint_follower:
  ros__parameters:
    use_sim_time: False
    loop_rate: 20
    stop_on_failure: false
    waypoint_task_executor_plugin: "wait_at_waypoint"
    wait_at_waypoint:
      plugin: "nav2_waypoint_follower::WaitAtWaypoint"
      enabled: True
      waypoint_pause_duration: 200

velocity_smoother:
  ros__parameters:
    use_sim_time: False
    smoothing_frequency: 20.0
    scale_velocities: False
    feedback: "OPEN_LOOP"
    max_velocity: [0.4, 0.0, 3.2]
    min_velocity: [-0.4, 0.0, -3.2]
    max_accel: [1.0, 0.0, 2.4]
    max_decel: [-1.0, 0.0, -2.4]
    odom_topic: "/odometry/filtered"
    odom_duration: 0.1
    deadband_velocity: [0.0, 0.0, 0.0]
    velocity_timeout: 1.0