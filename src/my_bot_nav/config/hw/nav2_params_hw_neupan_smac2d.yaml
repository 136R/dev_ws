# 全局: SmacPlanner2D (nav2_smac_planner/SmacPlanner2D)
# 局部: NeuPAN (nav2_core::Controller 插件, neupan_cpp_ros::NeuPANController)
#
# 障碍来源为 local costmap (含静态+动态+keepout 禁行区)。

bt_navigator:
  ros__parameters:
    use_sim_time: False
    global_frame: map
    robot_base_frame: base_footprint
    odom_topic: /odometry/filtered
    bt_loop_duration: 20
    default_server_timeout: 20

    # 全局规划器更新频率 与 行为恢复
    # 用 smac2d 专用 BT（去掉了 SmoothPath，平滑全交给 SmacPlanner2D 内置 Smoother）。
    # 另外 4 份配置(sim rpp/neupan + hw rpp/neupan)仍用 navigate_to_pose_custom.xml —— 它们
    # 是 ThetaStar，没有内置平滑器，SmoothPath 是唯一的平滑环节，不能删。
    default_nav_to_pose_bt_xml: /home/orangepi/dev_ws/src/my_bot_nav/config/common/bt/navigate_to_pose_smac2d.xml

    wait_for_service_timeout: 1000
    plugin_lib_names:
      - nav2_compute_path_to_pose_action_bt_node
      - nav2_compute_path_through_poses_action_bt_node
      - nav2_smooth_path_action_bt_node
      - nav2_follow_path_action_bt_node
      - nav2_spin_action_bt_node
      - nav2_wait_action_bt_node
      - nav2_assisted_teleop_action_bt_node
      - nav2_back_up_action_bt_node
      - nav2_drive_on_heading_bt_node
      - nav2_clear_costmap_service_bt_node
      - nav2_is_stuck_condition_bt_node
      - nav2_goal_reached_condition_bt_node
      - nav2_goal_updated_condition_bt_node
      - nav2_globally_updated_goal_condition_bt_node
      - nav2_is_path_valid_condition_bt_node
      - nav2_initial_pose_received_condition_bt_node
      - nav2_reinitialize_global_localization_service_bt_node
      - nav2_rate_controller_bt_node
      - nav2_distance_controller_bt_node
      - nav2_speed_controller_bt_node
      - nav2_truncate_path_action_bt_node
      - nav2_truncate_path_local_action_bt_node
      - nav2_goal_updater_node_bt_node
      - nav2_recovery_node_bt_node
      - nav2_pipeline_sequence_bt_node
      - nav2_round_robin_node_bt_node
      - nav2_transform_available_condition_bt_node
      - nav2_time_expired_condition_bt_node
      - nav2_path_expiring_timer_condition
      - nav2_distance_traveled_condition_bt_node
      - nav2_single_trigger_bt_node
      - nav2_goal_updated_controller_bt_node
      - nav2_is_battery_low_condition_bt_node
      - nav2_navigate_through_poses_action_bt_node
      - nav2_navigate_to_pose_action_bt_node
      - nav2_remove_passed_goals_action_bt_node
      - nav2_planner_selector_bt_node
      - nav2_controller_selector_bt_node
      - nav2_goal_checker_selector_bt_node
      - nav2_controller_cancel_bt_node
      - nav2_path_longer_on_approach_bt_node
      - nav2_wait_cancel_bt_node
      - nav2_spin_cancel_bt_node
      - nav2_back_up_cancel_bt_node
      - nav2_assisted_teleop_cancel_bt_node
      - nav2_drive_on_heading_cancel_bt_node
      - nav2_is_battery_charging_condition_bt_node

bt_navigator_navigate_through_poses_rclcpp_node:
  ros__parameters:
    use_sim_time: False

bt_navigator_navigate_to_pose_rclcpp_node:
  ros__parameters:
    use_sim_time: False

controller_server:
  ros__parameters:
    use_sim_time: False
    controller_frequency: 20.0
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.001
    min_theta_velocity_threshold: 0.001
    failure_tolerance: 0.3
    progress_checker_plugin: "progress_checker"
    goal_checker_plugins: ["general_goal_checker"]
    controller_plugins: ["FollowPath"]
    current_goal_checker: "general_goal_checker"

    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      required_movement_radius: 0.1
      movement_time_allowance: 8.0    # 停住 8s 判无进度失败（配合 BT number_of_retries 封顶恢复时长）
    general_goal_checker:
      stateful: True
      plugin: "nav2_controller::SimpleGoalChecker"
      xy_goal_tolerance: 0.05
      yaw_goal_tolerance: 6.28       # 不约束 yaw (差速 line 跟踪不保证终点朝向)

    # ────────────────────── RotationShim(先转) + NeuPAN(追踪+避障) ──────────────────────
    # NeuPAN 是纯 MPC，每步同时求解 v/w，朝向偏差大时只会"边走边转"成一条甩头弧线，
    # 没有离散的"先原地转向对齐再走"这一档——这不是调参能改的，是 MPC 架构本身决定的。
    # 用 Nav2 官方 RotationShimController 包一层：新路径下发时若朝向偏差超过阈值，
    # shim 自己原地转对齐，对齐后把控制权交还给 NeuPAN 继续追踪+避障；路径中途的转弯
    # 仍由 NeuPAN 平滑处理成弧线，不会逐个拐点都停下来转（不影响它在动态办公室世界里的避障能力）。
    FollowPath:
      plugin: "nav2_rotation_shim_controller::RotationShimController"
      primary_controller: "neupan_cpp_ros::NeuPANController"
      angular_dist_threshold: 1.047   # 60°；超过此偏差才原地转，小偏差仍交给 NeuPAN 用弧线自然纠正
      forward_sampling_distance: 0.5     # 沿路径前探 0.5m 取参考点算"该往哪转"，而非只看第一个点
      rotate_to_heading_angular_vel: 1.2 # 原地转的角速度(rad/s)；相对 NeuPAN 避障时的瞬时急转更保守
      max_angular_accel: 2.4             # 对齐 velocity_smoother 的 max_accel/max_decel theta，避免被削波变卡顿
      simulate_ahead_time: 1.0           # 原地转前用 costmap 模拟这段时间内是否会撞（shim 自带碰撞检测）
      rotate_to_goal_heading: false      # 终点朝向不约束，沿用 yaw_goal_tolerance: 6.28 的既有设定

      # —— 以下为 primary_controller(NeuPAN) 自身参数，与 shim 参数平铺在同一 FollowPath 命名空间 ——
      config_package: "my_bot_nav"                             # 相对路径按此包 share 解析
      config_file: "config/hw/neupan_hw.yaml"               # NeuPAN 规划器调参 (与模型几何一致)
      dune_checkpoint: "config/common/neupan/diff_mybot.bin"  # 用户自训模型
      map_frame: "map"
      base_frame: "base_footprint"
      include_initial_path_direction: false   # 参考朝向由路径点梯度推断
      cost_threshold: 254                      # >= 此代价的栅格视为障碍 (LETHAL=254, INSCRIBED=253)
      obstacle_stride: 2                       # 栅格抽稀步长 (1=全取; 增大可降负载)

local_costmap:
  local_costmap:
    ros__parameters:
      update_frequency: 20.0
      publish_frequency: 1.0
      global_frame: odom
      robot_base_frame: base_footprint
      use_sim_time: False
      rolling_window: true
      width: 3
      height: 3
      resolution: 0.05

      # 车体外廓 = 圆盘 ∪ 两个驱动轮，不是单纯的圆：
      #   圆盘   以 (-0.047, 0) 为心、r=0.11（base_link 在圆心前方 0.047，故 robot_radius 画不出来）
      #   驱动轮 俯视是矩形 x∈[-0.035, 0.035]、|y|∈[0.082, 0.11]（轮 r=0.035、厚 0.028、轴距中心 0.096）
      # ⚠️ 轮子必须单独算进来：圆盘在 x=0 处的半宽只有 √(0.11²-0.047²)=0.0995，而轮外沿在 0.11
      #    —— 轮子在此突出盘缘 10.5 mm。
      #    2026-08-12 修复：旧值只按「圆盘 + 余量」取正 12 边形，导致轮子前外角 (0.035, 0.11)
      #    露在 footprint 外 10.2 mm。改这个数时务必把轮子四角一起验，不要只验圆盘。
      # 现值：对 12 个方向取「外廓支撑函数 + 0.020 余量」的外切多边形，全部关键点余量均匀 20 mm。
      #      四个主轴方向与旧值完全相同（前 0.083 / 后 -0.177 / 侧 ±0.13），只在轮子所在斜向外扩。
      # 注：本文件余量沿用 0.020，与同目录 hw_rpp / hw_neupan 的 0.025 不同 —— 这是几何同步之前
      #    就存在的既有差异，不在本次修复范围内。
      # 裸外廓（无余量）备查：
      # footprint: "[[0.063, 0.0615], [0.035, 0.11], [-0.0765, 0.11], [-0.1275, 0.0805], [-0.157, 0.0295], [-0.157, -0.0295], [-0.1275, -0.0805], [-0.0765, -0.11], [0.035, -0.11], [0.063, -0.0615]]"
      footprint: "[[0.083, 0.0669], [0.0496, 0.1246], [0.0404, 0.13], [-0.0818, 0.13], [-0.1422, 0.0952], [-0.177, 0.0348], [-0.177, -0.0348], [-0.1422, -0.0952], [-0.0818, -0.13], [0.0404, -0.13], [0.0496, -0.1246], [0.083, -0.0669]]"

      plugins: ["obstacle_layer", "keepout_filter", "inflation_layer"]
      keepout_filter:
        plugin: "nav2_costmap_2d::KeepoutFilter"
        enabled: True
        filter_info_topic: "/costmap_filter_info"
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 6.0
        inflation_radius: 0.17
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: True
        observation_sources: scan
        scan:
          topic: /scan_filtered
          max_obstacle_height: 2.0
          clearing: True
          marking: True
          data_type: "LaserScan"
          # ⚠️ 必须 true。laser_filters 把超量程点替换成 +inf，默认 false 会整条丢弃
          # inf 射线，而清除障碍靠射线穿过格子 → 障碍标了永远清不掉。
          inf_is_valid: true
          # 不随雷达量程放大：本层被 3×3 窗口卡在 1.5m 半径，2.5 已经超出窗口了。
          raytrace_max_range: 3.0
          raytrace_min_range: 0.0
          obstacle_max_range: 2.5
          obstacle_min_range: 0.1
      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_subscribe_transient_local: True
      always_send_full_costmap: True

global_costmap:
  global_costmap:
    ros__parameters:
      update_frequency: 1.0
      publish_frequency: 1.0
      global_frame: map
      robot_base_frame: base_footprint
      use_sim_time: False

      # 车体外廓 = 圆盘 ∪ 两个驱动轮，不是单纯的圆：
      #   圆盘   以 (-0.047, 0) 为心、r=0.11（base_link 在圆心前方 0.047，故 robot_radius 画不出来）
      #   驱动轮 俯视是矩形 x∈[-0.035, 0.035]、|y|∈[0.082, 0.11]（轮 r=0.035、厚 0.028、轴距中心 0.096）
      # ⚠️ 轮子必须单独算进来：圆盘在 x=0 处的半宽只有 √(0.11²-0.047²)=0.0995，而轮外沿在 0.11
      #    —— 轮子在此突出盘缘 10.5 mm。
      #    2026-08-12 修复：旧值只按「圆盘 + 余量」取正 12 边形，导致轮子前外角 (0.035, 0.11)
      #    露在 footprint 外 10.2 mm。改这个数时务必把轮子四角一起验，不要只验圆盘。
      # 现值：对 12 个方向取「外廓支撑函数 + 0.020 余量」的外切多边形，全部关键点余量均匀 20 mm。
      #      四个主轴方向与旧值完全相同（前 0.083 / 后 -0.177 / 侧 ±0.13），只在轮子所在斜向外扩。
      # 注：本文件余量沿用 0.020，与同目录 hw_rpp / hw_neupan 的 0.025 不同 —— 这是几何同步之前
      #    就存在的既有差异，不在本次修复范围内。
      # 裸外廓（无余量）备查：
      # footprint: "[[0.063, 0.0615], [0.035, 0.11], [-0.0765, 0.11], [-0.1275, 0.0805], [-0.157, 0.0295], [-0.157, -0.0295], [-0.1275, -0.0805], [-0.0765, -0.11], [0.035, -0.11], [0.063, -0.0615]]"
      footprint: "[[0.083, 0.0669], [0.0496, 0.1246], [0.0404, 0.13], [-0.0818, 0.13], [-0.1422, 0.0952], [-0.177, 0.0348], [-0.177, -0.0348], [-0.1422, -0.0952], [-0.0818, -0.13], [0.0404, -0.13], [0.0496, -0.1246], [0.083, -0.0669]]"

      resolution: 0.05
      track_unknown_space: true
      plugins: ["static_layer", "obstacle_layer", "keepout_filter", "inflation_layer"]
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: True
        observation_sources: scan
        scan:
          topic: /scan_filtered
          max_obstacle_height: 2.0
          clearing: True
          marking: True
          data_type: "LaserScan"
          # 同 local_costmap 的说明。全局层这条更要紧：动态障碍(人)被标进全局图后
          # 若清不掉，SmacPlanner2D 会一直绕着一个【已经走开的人】规划，"绕路比"就是
          # 这么来的。global 只有 1Hz 更新，残留一次就要多绕好几秒。
          inf_is_valid: true
          # 全局层负责【选路线】，探测距离要够跨一个房间才能提前改道。
          # raytrace 要显著大于 obstacle：本层只有 1Hz，人走 1.2m/s 时标记天然滞后，
          # 清除范围留余量才追得上，否则人走了标记还在 → 绕着不存在的障碍规划。
          raytrace_max_range: 8.0
          raytrace_min_range: 0.0
          obstacle_max_range: 7.0
          obstacle_min_range: 0.1
      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_subscribe_transient_local: True
      keepout_filter:
        plugin: "nav2_costmap_2d::KeepoutFilter"
        enabled: True
        filter_info_topic: "/costmap_filter_info"
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 3.5
        inflation_radius: 0.2
      always_send_full_costmap: True

# Keepout 禁行区滤波信息服务（随 keepout.launch.py 启动）
costmap_filter_info_server:
  ros__parameters:
    use_sim_time: False
    type: 0                                  # 0 = keepout/preferred-lane 滤波
    filter_info_topic: "/costmap_filter_info"
    mask_topic: "/keepout_filter_mask"
    base: 0.0
    multiplier: 1.0

map_server:
  ros__parameters:
    use_sim_time: False
    yaml_filename: ""

map_saver:
  ros__parameters:
    use_sim_time: False
    save_map_timeout: 5.0
    free_thresh_default: 0.25
    occupied_thresh_default: 0.65
    map_subscribe_transient_local: True

planner_server:
  ros__parameters:
    expected_planner_frequency: 1.0
    use_sim_time: False
    planner_plugins: ["GridBased"]
    # 插件名保持 "GridBased" 不变——BT 里 ComputePathToPose 的 planner_id="GridBased" 才对得上
    GridBased:
      plugin: "nav2_smac_planner/SmacPlanner2D"
      # 到不了精确目标时, 可接受的退让距离(m)。原为 0.05(仅 1 格) —— 等于要求目标格
      # 必须精确可通行, 一旦动态障碍压上目标就直接 "no valid path found" 整个导航失败。
      # 2026-07-22 实测: 移动障碍压住目标 (-2.97,1.52) 时该格 cost=254, 需 >=0.10m 才
      # 够得着; 0.125 只剩半格余量, 故取 0.25(5 格)。
      # 调大无实质代价: goal_checker 的 xy_goal_tolerance=0.05 独立判定是否到达, 规划
      # 终点退让不会让机器人误以为到点, 它会开过去→发现没到→继续重规划, 等障碍走开后
      # 自然收敛到真目标。
      tolerance: 0.25
      downsample_costmap: false         # 不降采样 costmap（分辨率已 0.05，够用）
      downsampling_factor: 1
      allow_unknown: true               # 允许穿未知区域（track_unknown_space=true，避免局部无解）
      max_iterations: 1000000           # 搜索迭代上限（放大防大地图早退）
      max_on_approach_iterations: 1000  # 接近目标后允许的额外迭代
      max_planning_time: 1.0            # 单次规划超时(s)
      cost_travel_multiplier: 2.5       # 通过代价权重：越大越偏好远离障碍的低代价栅格（离障余量↑）
      use_final_approach_orientation: false
      smoother:                         # SmacPlanner2D 自带的路径平滑。现在是唯一的平滑环节
                                        # ——BT 已换成 navigate_to_pose_smac2d.xml，没有 SmoothPath 了。
        max_iterations: 1000
        w_smooth: 0.1                   # 平滑项权重（越大越平滑，可能偏离原路径）
        w_data: 0.5                     # 贴合原始路径权重
        tolerance: 1.0e-10

smoother_server:
  ros__parameters:
    use_sim_time: False
    smoother_plugins: ["simple_smoother"]
    simple_smoother:
      plugin: "nav2_smoother::SimpleSmoother"
      tolerance: 1.0e-10
      max_its: 1000
      do_refinement: True

behavior_server:
  ros__parameters:
    costmap_topic: local_costmap/costmap_raw
    footprint_topic: local_costmap/published_footprint
    cycle_frequency: 10.0
    behavior_plugins: ["spin", "backup", "drive_on_heading", "assisted_teleop", "wait"]
    spin:
      plugin: "nav2_behaviors/Spin"
    backup:
      plugin: "nav2_behaviors/BackUp"
    drive_on_heading:
      plugin: "nav2_behaviors/DriveOnHeading"
    wait:
      plugin: "nav2_behaviors/Wait"
    assisted_teleop:
      plugin: "nav2_behaviors/AssistedTeleop"
    global_frame: odom
    robot_base_frame: base_footprint
    transform_tolerance: 0.1
    use_sim_time: False
    simulate_ahead_time: 2.0
    max_rotational_vel: 1.0
    min_rotational_vel: 0.35
    rotational_acc_lim: 2.4

robot_state_publisher:
  ros__parameters:
    use_sim_time: False

waypoint_follower:
  ros__parameters:
    use_sim_time: False
    loop_rate: 20
    stop_on_failure: false
    waypoint_task_executor_plugin: "wait_at_waypoint"
    wait_at_waypoint:
      plugin: "nav2_waypoint_follower::WaitAtWaypoint"
      enabled: True
      waypoint_pause_duration: 200

velocity_smoother:
  ros__parameters:
    use_sim_time: False
    smoothing_frequency: 20.0
    scale_velocities: False
    feedback: "OPEN_LOOP"
    max_velocity: [0.37, 0.0, 3.2]
    min_velocity: [-0.37, 0.0, -3.2]
    max_accel: [1.1, 0.0, 2.5]
    max_decel: [-1.1, 0.0, -2.5]
    odom_topic: "odom"
    odom_duration: 0.1
    deadband_velocity: [0.0, 0.0, 0.0]
    velocity_timeout: 1.0
