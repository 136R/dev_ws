# =============================================================================
# NeuPAN 规划器参数（仿真）
# 作者/社区无专门调参指南，仅零散说明；据此只对"重要参数"加注：
#   - 核心作者：主要调参在 adjust 段；想跑更快调 receding/iter_num/*_max_num/iter_threshold；
#     robot 的 length/width 必须与实车一致
#   - neupan_cpp 作者点名主要调参：collision_threshold、adjust.d_max/d_min、ref_speed、max_speed
# 注释依据：neupan_cpp 源码（neupan_planner.cpp 解析、nrmp.cpp 代价函数）+ NeuPAN 核心 docstring。
# 标【neupan_cpp 未读取】者：已核对源码，该 C++ 版不解析，改之无效。
# =============================================================================

receding: 4            # MPC 后退时域步数。调大→看得更远、轨迹更平滑但计算量↑；调小→算得快、反应快但短视（作者列为提速可调项）
step_time: 0.25
ref_speed: 0.3          # 参考(期望)速度(m/s)，受 max_speed 上限约束。调大→跑更快但避障余量小；调小→更稳更慢
collision_threshold: 0.01  # 碰撞检测阈值(m)：最近障碍距离低于它即触发硬急停(零速)。调大→更早急停更安全、窄处易停死；调小→敢靠近但撞险↑
                           # 必须 > 0：负值/0 会被 NeuPANPlanner::validate() 拒绝，加载即抛异常（停车条件退化为"外形已重叠"，不可恢复）
                           # 关掉 backoff 后这是 controller 层唯一的急停判据；真正的避障余量在 adjust.d_min/d_max 与 costmap 的 inflation_radius
device: 'cpu'           # 【neupan_cpp 未读取】C++ 版无 PyTorch，改之无效
time_print: False       # 【neupan_cpp 未读取】仅上游 Python 版用于打印规划耗时，改之无效

robot:
  kinematics: 'diff'    # 运动学模型；neupan_cpp 仅支持 'diff'
  max_speed: [0.3, 3.14]   # [线速度, 角速度] 上限，约束实际输出。调大→机动性强但更险；调小→更稳
  max_acce: [1.0, 0.2]
  # 车体是以 base_link 后方 47mm 为心的 ⌀0.22 圆盘，外接矩形不以 base_link 居中。
  # robot.cpp 的 Robot::diffRectangle 取顶点 sx = -(length - wheelbase)/2，而 diff 运动学
  # 并不消费轴距，所以这里拿 wheelbase 当 x 向偏置用，把矩形挪到实际外廓的位置。
  # ⚠️ 三个值必须与训出 dune_checkpoint 的那份训练 yaml 逐位相同，也必须与 hw/sim 的另一份
  #    逐位相同（同一台实体机器人）。不一致不报错，只会让 DUNE 学的边界与 NRMP 约束的边界
  #    错位 —— 症状是没碰到却停车、或贴着障碍不减速。三个值的算法见 docs/neupan.md
  #    「DUNE 模型重训」的「踩过的坑」第 1 条。
  length: 0.22          # 前伸 + 后伸
  width: 0.22           # 侧伸 ×2
  wheelbase: -0.094     # 前伸 − 后伸；负值 = 车体相对 base_link 后偏

ipath:
  curve_style: 'line'   # 参考路径插值方式；neupan_cpp 仅支持 'line'（Python 版另支持 dubins/reeds）
  loop: False
  arrive_threshold: 0.05
  close_threshold: 0.05
  ind_range: 10
  arrive_index_threshold: 1

pan:
  iter_num: 1           # DUNE↔NRMP 交替最小化的外层迭代次数。调大→收敛更好、轨迹更优但耗时↑；调小→更快但可能未收敛（提速可调项）
  dune_max_num: 100     # DUNE 层考虑的最大障碍点数。调大→障碍表达更全但算力↑；调小→更快但可能漏障碍（提速可调项）
  nrmp_max_num: 10      # NRMP 层考虑的最大障碍点数。调大→约束更全更安全但更慢；调小→更快但避障信息少（提速可调项）
  iter_threshold: 0.1   # 判定迭代收敛的阈值，改进量低于它即停。调大→更早停更快但精度差；调小→迭代更充分但更慢（提速可调项）

adjust:                 # ← 作者：调参主要在本段
  q_s: [2.5, 2.5, 0.2]  # 状态(x,y,θ)跟踪权重（代价含 2·qs²）。作者：值越大→越贴合初始路径；调小→允许偏离、给避障让路
  p_u: 1.5              # 速度跟踪权重（代价含 2·p_u²）。调大→更贴 ref_speed；调小→允许变速以避障
  eta: 15.0             # 安全距离奖励增益（目标含 -eta·d，鼓励远离障碍）。调大→更保守绕行、离障更远；调小→允许贴近、路径更短
  d_max: 0.06            # 距离变量上界（硬约束, m）。调大→规划灵活度↑；调小→强制在更小距离范围内
  d_min: 0.01           # 距离变量下界（硬约束, m）。调大→强制离障更远更安全、窄处易不可行；调小→敢更近
  ro_obs: 400.0         # 避障约束违反的二次罚权重（J += 0.5·ro_obs·neg²）。调大→强惩闯障更安全；作者：值越小→可能需更多迭代才收敛
  bk: 0.0               # proximal 正则系数（J += 0.5·bk·(s−nom_s)²），拉近名义轨迹助收敛。调大→更稳定但探索性差；调小/0→无此正则

# 退避(retreat-on-stop)：fork 独有、默认关闭。
# 关闭理由：与 Nav2 BT 恢复链的 BackUp / Spin 职责重叠（见 my_bot_nav 的
# config/common/bt/navigate_to_pose_custom.xml 的 NavigateRecovery），且 controller 层自己后退会持续发非零速度，
# 给 general_goal_checker 的 movement_time_allowance 与 my_bot_task 的 task_params.yaml 的
# nav_watchdog（min_progress_m / stuck_timeout_sec）"充电"，把按实测日志算过的恢复预算悄悄改写掉。
# 下面三个值原样保留，要复活只需把 enabled 改回 true。
backoff:
  enabled: false
  release_distance: 0.15   # 退避目标：min_distance(离障碍距离) 退到 ≥ 此值才算"退够了"、恢复正常前进；没到之前每帧都会继续退/转。调大→要求退得更远更保守，但更难达标；调小→更快恢复前进，但可能没退开就又贴上去
  max_cycles: 80          # 退避最多尝试帧数：退满这么多帧还没达到 release_distance 就放弃，原地硬停，把问题交给 Nav2（重规划/恢复动作），不会无限退下去。调大→给退避更多机会退够；调小→更快放弃、更快交给外层处理
  turn_speed: 1.2         # 障碍在侧面（非正前/正后）时原地转开的角速度(rad/s)：差速车没有横移自由度，纯前后退对侧向障碍距离改变很小，改为转向躲开
