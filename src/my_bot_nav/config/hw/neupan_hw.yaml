# NeuPAN 本车专属配置（Phase 3+）
# 几何 = 本车真实轮廓（含轮，略带余量），必须与训练 diff_mybot.bin 时的 length/width 一致。
# 速度/加速度对齐 my_controllers.yaml（diff_cont 限值）。
# 配合专属 DUNE 模型使用：ros2 launch my_bot_nav neupan_sim.launch.py \
#   config_file:=<...>/config/hw/neupan_my_bot.yaml model:=<...>/config/hw/diff_mybot.bin
#
# 注释里 ↑=调大 / ↓=调小 的效果。核心矛盾：过窄缝(松裕度) vs 强避障(留距离) 方向相反，无法同时拉满。

# ========== MPC ==========
# 预测长度 = ref_speed * step_time * receding（当前 0.3*0.15*20 = 0.9m）。

receding: 8         # MPC 预测步数。 ↑预测更远/前瞻好、避障更有余量，但 QP 更大更慢、窄道约束多更难解；↓算得快、窄道易解，但看不远、避障来不及
step_time: 0.25       # MPC 模型时间步(s)。 ↑同 receding 下预测更远，但离散更粗、控制精度↓、线性化误差↑；↓控制更精细，但预测距离变短
ref_speed: 0.3        # 参考巡航速度(m/s)。 ↑预测更远、更倾向前进(不保守)，但受 max_speed 限幅；↓更保守易停、预测变短(需增大 receding/step_time 补偿)
collision_threshold: 0.01  # 急停阈值(m)，最小障碍距离低于它就发零速停车。 ↑稍远就停(更安全但窄道更易停)；↓更贴近才停(利过窄缝但更险)
device: 'cpu'
time_print: False

# ========== 机器人几何 / 运动学 ==========
robot:
  kinematics: 'diff'        # 运动学：diff=差速。改类型需换对应模型，一般不动
  # [线速度上限, 角速度上限]。必须 ≤ my_controllers.yaml 的 diff_cont 限值，否则规划轨迹被控制器削→跟踪失配
  max_speed: [0.3, 1.2]     # ↑跑更快/转更急；↓更慢更稳
  # [线加速度上限, 角加速度上限]。角加速度(第2个)是画龙关键：
  #   ↑转向能剧烈反转→易画龙/每次求解波动大；↓转向有阻尼、轨迹平滑、解空间小更易收敛(但转向迟缓)
  max_acce: [1.0, 0.4]
  # 车体矩形尺寸(m)，必须与训练 diff_mybot.bin 的几何一致！改了必须重训模型。
  length: 0.16              # ↑填大更保守(留更大边距、过不了窄缝)；↓填小更敢挤(但可能蹭到)
  width: 0.22               # 同上（本车含轮宽 ~0.22）

# ========== 初始/参考路径 ==========
ipath:
  curve_style: 'line'       # 参考路径插值：line=直线连 waypoint；也可 dubins/reeds(带最小转弯半径)
  loop: False               # 是否循环跑该路径
  arrive_threshold: 0.05     # 到达判定距离(m)。 ↑更早算"到达"停下；↓更精确到点(但可能末端反复微调)
  close_threshold: 0.05      # 接近判定距离(m)，用于切换到末端逼近逻辑
  ind_range: 10             # 沿路径找参考点的前瞻窗口(索引数)。 ↑参考点看更远(更平滑但可能抄近道)；↓更贴近当前位置
  arrive_index_threshold: 1 # 到达路径末端 index 的容差

# ========== PAN（DUNE + NRMP 交替最小化）==========
pan:
  iter_num: 2          # 每帧 PAN 交替迭代次数。 ↑更易收敛(紧通道更稳)、避障更优，但每帧更慢；↓更快但可能不收敛(画龙/无解)
  dune_max_num: 200    # 送入 DUNE 的最大障碍点数。 ↑障碍表达更全但更慢；↓更快但可能漏点
  nrmp_max_num: 10     # NRMP 实际使用的最近障碍点数。 ↑窄道两侧墙表达更准、避障更稳，但更慢；↓更快但紧通道可能表达不足
  iter_threshold: 0.1  # 收敛判定阈值。 ↑更早认为已收敛(快但糙)；↓要求更严(准但慢)

# ========== 权重 / 安全距离（adjust）==========
# 这一段是场景调参核心。过窄缝 vs 强避障方向相反，见文件顶部说明。
adjust:
  # 状态跟踪(跟随全局参考线)权重，向量 [x, y, theta]：
  #   x/y ↑更紧贴 A* 线(治画龙/脱线)，但避障自由度↓、开阔区显得"轴"；↓更愿离线绕障(避障强)但易脱线/画龙
  #   theta ↑朝向严格跟随路线切线；↓朝向自由(利窄道机动，你不在乎终点姿态)
  q_s: [2.5, 2.5, 0.3]
  # q_s: 5.0
  p_u: 1.5     # 速度/前进权重。 ↑更倾向按 ref_speed 前进、别停(治"有路不走")，但过大易跑很远躲障/擦碰；↓更保守
  eta: 10.0     # 安全距离松弛增益。 ↑强制离障碍更远(避障强/更安全)，但窄缝里"两边都想离远"→难解/不敢进；↓放松(敢挤窄缝)但避障弱、易贴墙
  d_max: 0.1   # 障碍影响距离上界/最大裕度(m)。 ↑从更远就开始躲、留更宽的道(避障强/前瞻好)；↓只在意很近的障碍(避障弱/反应晚)
  d_min: 0.01  # 最小安全距离(m)。 ↑强制留更大边距(安全，但窄缝可能无解)；↓允许更贴墙(过窄缝)但更险
  ro_obs: 100.0 # 避障惩罚/梯度步长(类学习率)。 ↑收敛快但易次优(可能蹭障碍)；↓避障更优但需配合 iter_num 调大
  bk: 0.0      # 收敛的 proximal 系数(官方默认 0.1)。 影响收敛稳定性，一般保持 0~0.1
