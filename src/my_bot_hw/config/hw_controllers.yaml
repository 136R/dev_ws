controller_manager:
  ros__parameters:
    update_rate: 100  # Hz

    diff_cont:
      type: diff_drive_controller/DiffDriveController

    joint_broad:
      type: joint_state_broadcaster/JointStateBroadcaster

    imu_broad:
      type: imu_sensor_broadcaster/IMUSensorBroadcaster

diff_cont:
  ros__parameters:
    publish_rate: 100.0
    velocity_rolling_window_size: 5  # smooth vx/wz over ~50 ms at 100 Hz
    base_frame_id: base_footprint

    left_wheel_names:  ['left_wheel_joint']
    right_wheel_names: ['right_wheel_joint']

    # 实测几何（几何真相源在这里，不在固件）
    wheel_separation: 0.192   # m，胎面中心间距
    wheel_radius: 0.035       # m，名义值

    # 2026-08-13 标定值，方法见 docs/里程计与雷达标定.md；左右轮径比只能整体缩放
    left_wheel_radius_multiplier: 0.94788
    right_wheel_radius_multiplier: 0.95026
    # 只影响 /diff_cont/odom 的 yaw 和 cmd_vel 逆解；EKF 航向来自 IMU，标定须读 /diff_cont/odom
    wheel_separation_multiplier: 0.95209
    use_stamped_vel: false

    odom_frame_id: odom
    base_frame_id: base_footprint
    enable_odom_tf: false  # TF 由 EKF 发布
    # EKF 只融合 vx，其余轴协方差设大等于忽略
    pose_covariance_diagonal: [1.0e6, 1.0e6, 1.0e6, 1.0e6, 1.0e6, 1.0e6]
    twist_covariance_diagonal: [1.0e-6, 1.0e6, 1.0e6, 1.0e6, 1.0e6, 1.0e-3]

    cmd_vel_timeout: 1.0  # s，超时无指令即停车

    # Velocity and acceleration limits
    linear:
      x:
        has_velocity_limits: true
        max_velocity: 0.45      # m/s
        min_velocity: -0.45     # m/s (allow reverse)
        has_acceleration_limits: true
        max_acceleration: 1.0  # m/s^2
        has_jerk_limits: false

    angular:
      z:
        has_velocity_limits: true
        max_velocity: 1.8      # rad/s
        min_velocity: -1.8     # rad/s
        has_acceleration_limits: true
        max_acceleration: 2.4  # rad/s^2
        has_jerk_limits: false
        

imu_broad:
  ros__parameters:
    sensor_name: imu_sensor
    frame_id: imu_link
    static_covariance_orientation: [0.001, 0.0, 0.0, 0.0, 0.001, 0.0, 0.0, 0.0, 0.001]
    static_covariance_angular_velocity: [
      4.910438514e-07, 1.802846229e-07, -4.252982458e-09,
      1.802846229e-07, 8.486915009e-07, -2.845166744e-08,
      -4.252982458e-09, -2.845166744e-08, 2.070375365e-07
    ]
    static_covariance_linear_acceleration: [
      8.121470482e-05, 9.929325329e-06, -1.754624293e-05,
      9.929325329e-06, 4.137433079e-05, -4.947191142e-06,
      -1.754624293e-05, -4.947191142e-06, 6.550673622e-05
    ]
