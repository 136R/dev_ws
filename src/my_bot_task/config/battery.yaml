# 电量监视（scripts/battery_monitor.py）：/battery_raw → /battery_status
#
# 电池已确认是 3S 锂电：上一卡实测满充 12.63 V ≈ 4.21 V/cell（见
# docs/spec/2026-08-06-电量感知-固件与协议.md 的验收 2-2）。下面整张表都建立在这个前提上。
battery_monitor:
  ros__parameters:
    # 采样 2 Hz 进滤波器，发布 1 Hz 就够 —— 这个话题只喂 GUI 显示和任务层的
    # 秒级阈值判定，没有任何人需要更快。
    publish_rate_hz: 1.0

    # 电压 → 电量百分比。**两个数组必须等长，且同时严格递减**（电压从高到低），
    # 不满足时节点会 error 退出，不会带着一张错表跑到实机上。
    #
    # ⚠️ ROS 2 参数不支持嵌套列表，所以不能写成 `- [12.60, 100]` —— 那样 rclpy
    #    在 declare_parameter 阶段就抛类型错误。拆成两个平行数组是唯一可行写法。
    #
    # 这五个点来自 3S 锂电的通用规格曲线，**不是本电池的实测放电曲线**。
    # 用户已明确百分比精度 ±10% 即可，不跑整天放电实验（见确认卡【假设】2）。
    # 显示偏了就回来改这五个数，改完 `ros2 param set` 不生效（表只在启动时读一次），
    # 要重启 battery_monitor。
    voltage_pct_table_v:   [12.60, 11.85, 11.10, 10.50,  9.60]
    voltage_pct_table_pct: [ 100.0,  75.0,  40.0,  15.0,   0.0]
    #                         ↑满充   ↑平台   ↑标称   ↑平台   ↑截止
    #                       4.20V/c  起点   3.70V/c  末端  3.20V/c

    # 15 点 @2 Hz ≈ 7.5 s 的中值窗口。杀的是电机启停那一瞬的电流尖峰 ——
    # 那是内阻压降，不是电量变化，不该进电量估计。
    median_window: 15

    # 中值之后再压一层 EMA。3S 平台区 80%→20% 只掉约 0.6 V，而实测行驶时读数
    # 峰峰值就有 0.20 V 量级 —— 噪声比信号大，这一层不能省。
    # 代价是决策电压滞后约 30 s；对"要不要回家"这种分钟级决策完全够用。
    ema_tau_sec: 30.0

    # 单调棘轮：发布的百分比可以自由下降，但要上升必须连续高于当前值这么久。
    # 治的是"机器人一停下来电压回弹、界面电量往上跳"——那是内阻压降恢复，不是充电。
    # 放行时同时把 power_supply_status 置成 CHARGING。
    ratchet_rise_hold_sec: 180.0

    # >0 时旁路真实 /battery_raw，按 2 Hz 自造样本喂进同一条处理链。
    # A4 的仿真验收全靠它（仿真里根本没有 STM32）。
    # ⚠️ 实机上跑完务必设回 -1.0，否则机器人会拿一个假电压做归位决策。
    #    节点在开启/关闭注入时都会打 warn，日志里查得到。
    debug_force_voltage: -1.0
