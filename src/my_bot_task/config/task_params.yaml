task_manager:
  ros__parameters:
    # 地图名。留空 → 读 ~/.maps/current_map（和 slam/keepout 的行为一致）
    map_name: ""

    # 坐标 → 房间名的就近匹配半径(米)。app 发的是拓扑点自存的 x/y，毫米级精确，
    # 0.5 绰绰有余。匹配不到的目标（比如 RViz 随手点的）不会被拒绝，
    # 而是退化成匿名任务"点(1.20, 3.40)"，照样走完整流程。
    match_radius: 0.5

    # 待命点。优先级: home_pose(非空) > 拓扑里名叫 HOME 的点 > 启动时的 TF 位姿(并 warn)
    # 注意：用的是【名字约定】而不是拓扑的 type 枚举 —— 见 docs/README.md 的不变量表
    home_point_name: "HOME"
    # home_pose: [0.0, 0.0, 0.0]   # 取消注释以覆盖 home_point_name。
    #   ⚠️ 不要写成 home_pose: [] —— 空列表在 rclpy 里是 NOT_SET，节点会起不来。
    #   不想用就【整行注释掉】。

    # 到达后停留多久自动归位(秒)。用户也可以在 app 上点「停止导航」提前结束（= 手动完成）
    dwell_sec: 20.0

    # 单次导航失败的重试次数（总尝试 = nav_retry_max + 1）。绝不无限重试。
    nav_retry_max: 2
    retry_backoff_sec: 2.0

    # false → 退化成"纯排队导航"，做完任务原地待命不回家
    return_home: true

    # 轮询 .topology / current_map 的 mtime，改了就热重载（app 上加完点不用重启节点）
    poll_period_sec: 2.0
    settle_sec: 0.5

    # 给 app 前端的 HTTP 口（GET /task/status, POST /task/skip）。
    # app 后端占了 8080，且它是【固定 schema 的 protobuf 桥】，消费不了自定义类型 ——
    # 所以任务层自己开一个口，前端 1Hz 轮询。
    http_port: 8090

    # ETA = 剩余路径长度 ÷ 这个速度。
    # 不用 Nav2 自己的 estimated_time_remaining —— 它是"剩余距离 ÷ 当前瞬时线速度"，
    # 转弯/过门减速时会炸到几百秒再跳回来。
    # 默认 0.2 < NeuPAN 的 ref_speed 0.3，因为过门和转弯拉低了实际均速。按实测调：
    #   实测均速 = 路径长度 / 实际耗时
    eta_speed_mps: 0.2

    # ---- 低电自动归位 ----
    # 判定走【电压】不走百分比：百分比允许 ±10% 误差，20% 的触发点会漂到 10%~30%，
    # 和 critical 地板挤在一起。电压是 battery_monitor 滤波后的值（中值+EMA）。
    # 这七个都是每次判定重新读参数，`ros2 param set /task_manager low_voltage 10.9`
    # 能当场生效，调阈值不用重启。
    #
    # ⚠️⚠️ 这三个电压阈值全部落在【固件标定未覆盖的区间】。
    #    固件的 BATTERY_GAIN_CORR = 1.0111 只由 12.30 / 12.44 两点算出，三个采样点
    #    全挤在 12.30~12.63 V（0.33 V 宽），10~11 V 区间一个数据都没有 —— 上一卡的
    #    验收 1-1 被降级为单点标定（用户选择不接稳压电源）。
    #
    #    分歧有多大：把误差当纯增益（固件的做法）还是纯偏置（另一种可能），
    #    在 10.70 V 处只差约 16 mV，在 9.90 V 处约 24 mV。都远小于实测噪声
    #    （静止 44 mV 峰峰）。所以【没有】为此额外抬高阈值 —— 那会白白牺牲续航。
    #    真正没被验证的是上面那张 voltage_pct_table 本身（规格曲线，非实测放电）。
    #
    #    若归位触发得明显过早/过晚，**第一个该查的是这里**：拿可调电源扫
    #    10 / 11 / 12.6 V 三点，看固件读数与电源示数的比值是否恒定。
    #    同一线索也写在 firmware/my_robot_stm32/Core/Inc/app/battery.h 的注释里。
    low_voltage: 10.70        # ≈20%，触发放弃任务 + 归位（用户指定的意图是"20% 回家"）
    resume_voltage: 11.19     # ≈45%，解除低电锁定
    # critical 用绝对电压而非百分比：它是"再跑就要欠压复位"的物理地板，
    # 与电量估计准不准无关。百分比允许 ±10%，地板不允许。
    critical_voltage: 9.90    # 3.30 V/cell ≈5%，就地停住，不再尝试归位

    # 低于 low_voltage 连续这么久才置位。EMA 已经滞后 30s，这里再加 30s 去抖，
    # 总延迟约 1 分钟 —— 对分钟级的电量下降完全够用。
    low_debounce_sec: 30.0
    # 高于 resume_voltage 连续这么久才复位。挡的是"停车后电压回弹"造成的假恢复：
    # 车一停内阻压降消失，电压能弹回 0.3V 以上，但电量并没有增加。
    resume_debounce_sec: 120.0

    # /battery_status 超这么久没消息 → 判失联 → **失效开放**（绝不触发低电）。
    # 反过来做的话，一次固件回滚（proto_ver 对不上 → present=false）就会把机器人
    # 永久锁在 HOME —— 那比"电量估计缺失"糟得多。
    battery_stale_sec: 30.0

    # 人工覆盖时长：POST /task/force_resume 之后这么久内不做任何低电判定。
    # 现场演示时 20% 也得能跑，否则这个功能会被用户自己关掉。
    override_sec: 600.0

# 导航卡死看门狗（scripts/nav_watchdog.py）。和 task_manager 是两个节点，
# 但共用这一份 yaml —— launch 里把同一个 task_params_file 传给两个节点，
# 各自只读自己名字下的 ros__parameters 块。
nav_watchdog:
  ros__parameters:
    # 机器人连续这么多秒位移不超过 min_progress_m，就判定"卡死"。
    # 要明显大于 Nav2 自己 BT 恢复行为的正常耗时（清 costmap+wait 5s+spin+backup），
    # 不然会跟 Nav2 自己的恢复动作打架、误报。
    # ⚠️ 反向耦合：这 30s 同时给 Nav2 BT 的恢复重试次数设了上限。改小它之前，先看
    #    src/my_bot_nav/config/common/bt/navigate_to_pose_custom.xml 的 NavigateRecovery
    #    注释（那里按 N 列了恢复总耗时预算）。恢复期间机器人位移≈0，全程在给这个
    #    计时器充电；两处任一方单独改动都可能让二者打架。
    stuck_timeout_sec: 30.0
    # 注意：BT 恢复链里的 BackUp backup_dist=0.15 恰好等于这个阈值，是有意的临界设计。
    min_progress_m: 0.15
    check_period_sec: 2.0
