task_manager:
  ros__parameters:
    # 地图名。留空 → 读 ~/.maps/current_map（和 slam/keepout 的行为一致）
    map_name: ""

    # 坐标 → 房间名的就近匹配半径(米)。app 发的是拓扑点自存的 x/y，毫米级精确，
    # 0.5 绰绰有余。匹配不到的目标（比如 RViz 随手点的）不会被拒绝，
    # 而是退化成匿名任务"点(1.20, 3.40)"，照样走完整流程。
    match_radius: 0.5

    # 待命点。优先级: home_pose(非空) > 拓扑里名叫 HOME 的点 > 启动时的 TF 位姿(并 warn)
    # 注意：用的是【名字约定】而不是拓扑的 type 枚举 —— 见 docs/README.md 的不变量表
    home_point_name: "HOME"
    # home_pose: [0.0, 0.0, 0.0]   # 取消注释以覆盖 home_point_name。
    #   ⚠️ 不要写成 home_pose: [] —— 空列表在 rclpy 里是 NOT_SET，节点会起不来。
    #   不想用就【整行注释掉】。

    # 到达后停留多久自动归位(秒)。用户也可以在 app 上点「停止导航」提前结束（= 手动完成）
    dwell_sec: 20.0

    # 单次导航失败的重试次数（总尝试 = nav_retry_max + 1）。绝不无限重试。
    nav_retry_max: 2
    retry_backoff_sec: 2.0

    # false → 退化成"纯排队导航"，做完任务原地待命不回家
    return_home: true

    # 轮询 .topology / current_map 的 mtime，改了就热重载（app 上加完点不用重启节点）
    poll_period_sec: 2.0
    settle_sec: 0.5

    # 给 app 前端的 HTTP 口（GET /task/status, POST /task/skip）。
    # app 后端占了 8080，且它是【固定 schema 的 protobuf 桥】，消费不了自定义类型 ——
    # 所以任务层自己开一个口，前端 1Hz 轮询。
    http_port: 8090

    # ETA = 剩余路径长度 ÷ 这个速度。
    # 不用 Nav2 自己的 estimated_time_remaining —— 它是"剩余距离 ÷ 当前瞬时线速度"，
    # 转弯/过门减速时会炸到几百秒再跳回来。
    # 默认 0.2 < NeuPAN 的 ref_speed 0.3，因为过门和转弯拉低了实际均速。按实测调：
    #   实测均速 = 路径长度 / 实际耗时
    eta_speed_mps: 0.2

# 导航卡死看门狗（scripts/nav_watchdog.py）。和 task_manager 是两个节点，
# 但共用这一份 yaml —— launch 里把同一个 task_params_file 传给两个节点，
# 各自只读自己名字下的 ros__parameters 块。
nav_watchdog:
  ros__parameters:
    # 机器人连续这么多秒位移不超过 min_progress_m，就判定"卡死"。
    # 要明显大于 Nav2 自己 BT 恢复行为的正常耗时（清 costmap+spin+wait 2s+backup，
    # 正常几秒内做完），不然会跟 Nav2 自己的恢复动作打架、误报。
    stuck_timeout_sec: 30.0
    min_progress_m: 0.15
    check_period_sec: 2.0
